<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>呼吸ケアマップ</title>
<meta name="theme-color" content="#0B1620">
<meta name="description" content="酸素療法・人工呼吸器・気道管理などの呼吸ケアをまとめた参照ツール">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KenMaP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B1620'/%3E%3Cpolyline points='4,17 9,17 12,8 16,24 19,17 28,17' fill='none' stroke='%234FD8C4' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0B1620;
    --panel:#12212C;
    --panel-alt:#1A2C38;
    --ink:#EAF2F5;
    --ink-2:#9FB4C0;
    --ink-3:#647A87;
    --line:#223440;
    --line-strong:#2E4552;
    --teal:#4FD8C4;
    --teal-dim:#1F4A44;
    --amber:#F5B942;
    --amber-dim:#4A3B1A;
    --coral:#FF7A6B;
    --blue:#5B9BD9;
    --violet:#B79CED;
    --radius-sm:6px;
    --radius-md:10px;
  }
  *{box-sizing:border-box;}
  ::selection{background:var(--teal-dim); color:var(--ink);}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono', monospace; font-variant-numeric:tabular-nums;}
  a{color:var(--teal);}

  header{
    border-bottom:1px solid var(--line);
    padding:18px 28px 15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    position:sticky; top:0;
    background:rgba(11,22,32,.92);
    backdrop-filter:blur(6px);
    z-index:5;
  }
  header .title-block{display:flex; align-items:center; gap:12px;}
  header .brand-mark{
    width:34px; height:34px; border-radius:9px; background:var(--panel);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  header .title-block h1{
    font-size:18px;
    font-weight:700;
    margin:0 0 3px;
    letter-spacing:.01em;
  }
  header .title-block p{
    font-size:12px;
    color:var(--ink-3);
    margin:0;
    letter-spacing:.01em;
  }
  #wave{ flex-shrink:0; }
  header a.brand-mark{text-decoration:none;}
  header a.brand-mark:hover{border-color:var(--teal);}
  .hub-back{display:inline-block; font-size:11px; color:var(--ink-3); text-decoration:none; letter-spacing:.04em; margin-bottom:1px;}
  .hub-back:hover{color:var(--teal);}

  .layout{
    display:flex;
    align-items:flex-start;
  }
  nav{
    width:252px;
    flex-shrink:0;
    border-right:1px solid var(--line);
    padding:16px 10px 40px;
    position:sticky;
    top:73px;
    max-height:calc(100vh - 73px);
    overflow-y:auto;
  }
  .cat-label{
    display:flex; align-items:center; gap:7px;
    font-size:11.5px;
    color:var(--ink-2);
    letter-spacing:.05em;
    padding:9px 10px;
    margin-top:4px;
    text-transform:uppercase;
    font-weight:500;
    cursor:pointer;
    user-select:none;
    border-radius:var(--radius-sm);
    transition:background .12s ease;
  }
  .cat-label:hover{background:var(--panel-alt); color:var(--ink);}
  .cat-label:first-of-type{margin-top:10px;}
  .cat-label svg{width:13px; height:13px; flex-shrink:0;}
  .cat-label .cat-count{
    margin-left:auto; font-size:10.5px; color:var(--ink-3); background:var(--panel);
    border:1px solid var(--line); border-radius:20px; padding:1px 7px; text-transform:none; letter-spacing:0;
  }
  .cat-label .chevron{
    display:flex; color:var(--ink-3); transition:transform .15s ease; flex-shrink:0;
  }
  .cat-label.expanded .chevron{transform:rotate(90deg);}
  .cat-label.expanded{color:var(--ink);}
  .mod-item{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    color:var(--ink-2);
    font-family:inherit;
    font-size:13.5px;
    padding:8px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .mod-item:hover{background:var(--panel-alt); color:var(--ink);}
  .mod-item.active{background:var(--panel-alt); color:var(--ink); font-weight:500; box-shadow:inset 2px 0 0 var(--teal);}
  .mod-item-child{padding-left:26px;}
  .dot{
    width:7px; height:7px; border-radius:50%; flex-shrink:0;
    background:var(--ink-3);
    transition:background .15s ease;
  }
  .dot.status-draft{background:var(--amber);}
  .dot.status-done{background:var(--teal);}
  .mod-item span.label{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  main{
    flex:1;
    padding:30px 40px 60px;
    min-width:0;
    max-width:860px;
  }

  /* overview */
  .overview-head h2{font-size:19px; margin:0 0 7px; font-weight:700;}
  .overview-head p{color:var(--ink-2); font-size:13.5px; max-width:600px;}
  .progress-row{
    display:flex; gap:12px; margin:24px 0 8px; flex-wrap:wrap;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px 18px;
    min-width:128px;
    flex:1;
  }
  .stat-card .num{font-size:25px; font-weight:700; letter-spacing:-.01em;}
  .stat-card .lab{font-size:11.5px; color:var(--ink-3); margin-top:3px;}
  .bar-outer{
    height:7px; background:var(--panel); border-radius:4px; overflow:hidden; margin:18px 0 30px;
    border:1px solid var(--line);
    display:flex;
  }
  .bar-inner{height:100%; background:var(--teal); width:0%; transition:width .4s ease;}

  .cat-block{margin-bottom:26px;}
  .cat-block h3{
    display:flex; align-items:center; gap:8px;
    font-size:12.5px; color:var(--ink-2); letter-spacing:.05em; margin:0 0 12px; text-transform:uppercase; font-weight:500;
  }
  .cat-block h3 svg{width:15px; height:15px;}
  .cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px;}
  .mini-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:13px 14px; cursor:pointer;
    border-left:3px solid var(--cat-color, var(--line));
    transition:border-color .15s ease, transform .1s ease;
  }
  .mini-card:hover{border-color:var(--line-strong); border-left-color:var(--cat-color, var(--line-strong)); transform:translateY(-1px);}
  .mini-card .mtitle{font-size:13.5px; font-weight:500; margin-bottom:8px; line-height:1.4;}
  .mini-card .mstatus{
    font-size:11px; color:var(--ink-3); display:inline-flex; align-items:center; gap:6px;
    padding:3px 9px; border-radius:20px; background:var(--panel-alt);
  }

  /* module detail */
  .breadcrumb{
    display:flex; align-items:center; gap:6px;
    font-size:11.5px; color:var(--ink-3); margin-bottom:8px; letter-spacing:.03em;
  }
  .breadcrumb svg{width:13px; height:13px; flex-shrink:0;}
  .mod-title{font-size:21px; font-weight:700; margin:0 0 5px; letter-spacing:-.005em;}
  .mod-goal{color:var(--ink-2); font-size:14px; margin:0 0 22px; max-width:620px;}

  .status-row{display:flex; align-items:center; gap:10px; margin-bottom:24px; flex-wrap:wrap;}
  .status-row .lab{font-size:12px; color:var(--ink-3);}
  .status-btn{
    font-family:inherit; font-size:12.5px; padding:6px 13px; border-radius:20px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink-2); cursor:pointer;
    transition:all .12s ease;
  }
  .status-btn:hover{border-color:var(--line-strong);}
  .status-btn.st-未着手{border-color:var(--ink-3); color:var(--ink-2);}
  .status-btn.st-下書き{border-color:var(--amber); background:var(--amber-dim); color:var(--amber);}
  .status-btn.st-完成{border-color:var(--teal); background:var(--teal-dim); color:var(--teal);}


  /* simulator */
  main.wide{max-width:1180px;}
  .sim-block{padding:0; border:none; background:none;}
  .sim-top{margin-bottom:14px;}
  .sim-grid{display:grid; grid-template-columns:300px minmax(0,1fr); gap:16px; align-items:start;}
  .sim-controls{display:flex; flex-direction:column; gap:14px;}
  .sim-panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:14px 14px 10px;}
  .sim-panel-title{font-size:12.5px; color:var(--ink-2); font-weight:500; margin-bottom:10px; letter-spacing:.04em;}
  .sim-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .sim-chip{font-family:inherit; font-size:12px; padding:5px 11px; border-radius:20px; border:1px solid var(--line); background:var(--panel-alt); color:var(--ink-2); cursor:pointer;}
  .sim-chip:hover{border-color:var(--line-strong); color:var(--ink);}
  .sim-chip.active{border-color:var(--teal); color:var(--teal); background:var(--teal-dim);}
  .sim-chip.scn{border-style:dashed;}
  .sim-hint{margin-top:2px; padding:11px 14px; border-left:3px solid var(--amber); background:var(--amber-dim); border-radius:0 8px 8px 0; font-size:13px; color:var(--ink); line-height:1.75;}
  .sim-slider{margin-bottom:12px;}
  .sim-slider-head{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-2); margin-bottom:2px;}
  .sim-slider-head .mono{color:var(--teal); font-size:12px;}
  .sim-slider input[type=range]{width:100%; accent-color:var(--teal); margin:4px 0; padding:0; border:none; background:none; height:26px;}
  .sim-row2{display:flex; gap:10px; margin-bottom:8px;}
  .sim-row2 input, .sim-row2 select{width:100%; min-width:0;}
  .sim-row2 > div{flex:1;}
  .sim-note{font-size:11.5px; color:var(--ink-3); line-height:1.7;}
  .sim-toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:10px;}
  .sim-toolbar .sim-chip{margin:0;}
  .sim-toolbar-sp{flex:1;}
  .sim-toolbar-lab{font-size:11.5px; color:var(--ink-3);}
  .sim-btn{font-family:inherit; font-size:12px; padding:6px 12px; border-radius:6px; border:1px solid var(--line-strong); background:var(--panel); color:var(--ink); cursor:pointer;}
  .sim-btn:hover{border-color:var(--teal);}
  .sim-btn:disabled{opacity:.4; cursor:default; border-color:var(--line);}
  #sim-charts{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md); padding:6px 4px; width:100%; overflow:hidden;}
  .sim-svg{display:block; max-width:100%;}
  .sim-legend{font-size:11.5px; color:var(--ink-3); margin:8px 2px 12px; display:flex; flex-wrap:wrap; align-items:center; gap:6px;}
  .lg-band{display:inline-block; width:16px; height:10px; background:var(--teal); opacity:.25; border-radius:2px;}
  .lg-dash{display:inline-block; width:18px; border-top:2px dashed var(--ink-2); margin-left:14px;}
  .sim-metrics{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-bottom:16px;}
  .sim-metric{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px;}
  .sim-metric.warn{border-color:var(--amber);}
  .sim-metric.danger{border-color:var(--coral);}
  .sm-label{font-size:11px; color:var(--ink-3); line-height:1.4; min-height:30px;}
  .sm-val{font-size:19px; font-weight:500;}
  .sm-unit{font-size:11px; color:var(--ink-3); font-family:'Zen Kaku Gothic New',sans-serif;}
  .sm-sub{font-size:11px; color:var(--ink-3);}
  .sm-sub.ghost{color:var(--ink-2);}
  .sim-comments-title{font-size:12.5px; color:var(--ink-2); font-weight:500; margin-bottom:8px;}
  .sim-comment{display:flex; gap:10px; font-size:13px; color:var(--ink-2); line-height:1.75; padding:8px 12px; background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:6px;}
  .sc-dot{width:8px; height:8px; border-radius:50%; background:var(--blue); flex-shrink:0; margin-top:9px;}
  .sim-comment.warn .sc-dot{background:var(--amber);}
  .sim-comment.ok .sc-dot{background:var(--teal);}
  @media (max-width:900px){ .sim-grid{grid-template-columns:1fr;} }
  .rdos-item{margin-bottom:16px;}
  .rdos-label{font-size:13px; color:var(--ink); margin-bottom:7px; line-height:1.5;}
  .rdos-options{display:flex; gap:8px; flex-wrap:wrap;}
  .rdos-opt{
    font-family:inherit; font-size:12.5px; padding:7px 13px; border-radius:20px;
    border:1px solid var(--line); background:var(--panel-alt); color:var(--ink-2); cursor:pointer;
    transition:all .12s ease;
  }
  .rdos-opt:hover{border-color:var(--line-strong);}
  .rdos-opt.active{border-color:var(--teal); background:var(--teal-dim); color:var(--teal); font-weight:500;}
  .rdos-total-row{
    display:flex; align-items:baseline; gap:10px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
  }
  .rdos-total-value{font-size:26px; font-weight:700; color:var(--teal);}
  .ref-cite{
    font-size:11.5px; color:var(--ink-3); border-top:1px solid var(--line); margin-top:6px; padding-top:14px; line-height:1.7;
  }
  .ref-cite a{color:var(--ink-3); text-decoration:underline;}

  .disclaimer{
    background:var(--amber-dim); border:1px solid var(--amber);
    border-radius:var(--radius-md); padding:14px 18px; margin-bottom:20px;
    display:flex; gap:12px; align-items:flex-start;
  }
  .disclaimer svg{flex-shrink:0; margin-top:2px;}
  .disclaimer-text{font-size:12.5px; color:var(--ink-2); line-height:1.75;}
  .disclaimer-text strong{color:var(--amber); font-weight:600;}

  .section-block{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:19px 22px; margin-bottom:14px;
  }
  .section-block h4{font-size:12.5px; color:var(--ink-2); margin:0 0 12px; letter-spacing:.04em; text-transform:uppercase; font-weight:500;}
  .section-block h4.sub-heading{font-size:14.5px; color:var(--ink); text-transform:none; letter-spacing:0; font-weight:500;}
  .section-block ul{margin:0; padding-left:18px;}
  .section-block li{font-size:13.5px; margin-bottom:7px; color:var(--ink-2);}
  .section-block li::marker{color:var(--ink-3);}
  .placeholder-note{
    font-size:12.5px; color:var(--ink-3); border:1px dashed var(--line); border-radius:8px;
    padding:12px 14px; margin-top:4px; line-height:1.6;
  }

  .wf-svg{
    width:100%; height:104px; display:block;
    background:var(--panel-alt); border:1px solid var(--line); border-radius:8px;
  }

  @keyframes breathe{
    0%{ transform:scale(0.84); }
    33.3%{ transform:scale(1.06); }
    100%{ transform:scale(0.84); }
  }
  .lung-hero{
    display:flex; align-items:center; gap:26px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:20px 26px; margin:22px 0 26px;
  }
  .lung-svg-wrap{width:120px; height:120px; flex-shrink:0;}
  .lung-anim{
    animation:breathe 3s cubic-bezier(.4,0,.2,1) infinite;
    transform-box:fill-box; transform-origin:50% 55%;
  }
  .lung-hero-info{flex:1; min-width:0;}
  .lung-hero-title{font-size:13px; color:var(--ink-2); margin-bottom:2px;}
  .lung-hero-sub{font-size:11px; color:var(--ink-3); margin-bottom:14px;}
  .lung-values{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px 22px;}
  .lung-value-item .lv-label{font-size:11px; color:var(--ink-3); margin-bottom:2px;}
  .lung-value-item .lv-num{font-size:15px; font-weight:600; color:var(--ink);}
  @media (max-width:760px){
    .lung-hero{flex-direction:column; align-items:flex-start; gap:16px;}
    .lung-svg-wrap{width:96px; height:96px; align-self:center;}
  }
  .wf-wrap{position:relative;}
  .wf-ylabel{
    position:absolute; top:8px; left:12px; font-size:11px; color:var(--ink-3);
    pointer-events:none; letter-spacing:.01em;
  }
  .wf-xlabel{
    position:absolute; right:10px; transform:translateY(-50%); font-size:11px; color:var(--ink-3);
    pointer-events:none; white-space:nowrap; background:var(--panel-alt); padding-left:4px;
  }
  .wf-chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .wf-chip{
    font-family:inherit; font-size:12.5px; padding:6px 13px; border-radius:20px;
    border:1px solid var(--line); background:var(--panel-alt); color:var(--ink-2); cursor:pointer;
    transition:all .12s ease;
  }
  .wf-chip:hover{border-color:var(--line-strong);}
  .wf-chip.active{border-color:var(--teal); background:var(--teal-dim); color:var(--teal);}

  .table-wrap{overflow-x:auto; margin-top:10px; border-radius:8px; border:1px solid var(--line);}
  table.ref-table{width:100%; border-collapse:collapse; font-size:13px; min-width:420px;}
  table.ref-table th, table.ref-table td{
    padding:9px 12px; text-align:left; border-bottom:1px solid var(--line);
  }
  table.ref-table th{
    color:var(--ink-3); font-weight:500; font-size:11px; letter-spacing:.03em;
    text-transform:uppercase; background:var(--panel-alt);
  }
  table.ref-table tbody tr:last-child td{border-bottom:none;}
  table.ref-table tbody tr:nth-child(even){background:rgba(255,255,255,.015);}
  table.ref-table tbody tr:hover{background:var(--panel-alt);}

  .field-label{display:block; font-size:11.5px; color:var(--ink-3); margin-bottom:5px;}
  .calc-row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:14px;}
  .calc-input, .calc-select, select, input[type="number"], input[type="text"]{
    background:var(--bg); color:var(--ink); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:8px 11px; font-family:inherit; font-size:13px; width:100px;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  .calc-select, select{width:auto; min-width:130px;}
  .calc-input:hover, .calc-select:hover, select:hover, input:hover{border-color:var(--line-strong);}
  .calc-input:focus, .calc-select:focus, select:focus, input:focus, textarea:focus{
    outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(79,216,196,.14);
  }
  .calc-result-row{font-size:14px; margin-bottom:6px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .calc-result-label{color:var(--ink-2);}
  .calc-result-value{font-size:22px; font-weight:500; color:var(--teal);}

  textarea.memo{
    width:100%; min-height:80px; background:var(--bg); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px;
    font-family:inherit; font-size:13px; resize:vertical;
  }

  @media (min-width: 761px) and (max-width: 1024px){
    nav{width:210px; padding:14px 8px;}
    main{padding:26px 28px 50px; max-width:none;}
    header{padding:16px 20px 13px;}
    .cat-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
  }

  @media (max-width: 760px){
    header{padding:14px 16px 12px; flex-wrap:wrap;}
    #wave{width:96px; height:24px;}
    .layout{flex-direction:column;}
    nav{
      width:100%; border-right:none; border-bottom:1px solid var(--line);
      position:static; max-height:none; padding:10px 12px;
      display:flex; overflow-x:auto; gap:4px; white-space:nowrap;
    }
    .cat-label{padding:8px 8px 4px; flex-shrink:0;}
    .mod-item{flex-shrink:0; width:auto;}
    .mod-item .label{max-width:150px;}
    main{padding:20px 16px 48px; max-width:none;}
    .cat-grid{grid-template-columns:1fr;}
    .calc-row{gap:10px;}
  }
</style>
</head>
<body>

<header>

function rdosBlock(){
  let html = '<div id="rdos-widget">';
  RDOS_ITEMS.forEach(item=>{
    html += '<div class="rdos-item"><div class="rdos-label">'+item.label+'</div><div class="rdos-options">';
    item.options.forEach((opt,i)=>{
      html += '<button class="rdos-opt" data-item="'+item.id+'" data-score="'+opt.score+'">'+opt.label+' ('+opt.score+'点)</button>';
    });
    html += '</div></div>';
  });
  html += '<div class="rdos-total-row"><span style="color:var(--ink-2); font-size:13px;">合計スコア</span>'
    + '<span class="rdos-total-value mono" id="rdos-total">0</span><span style="color:var(--ink-3); font-size:12px;">/ 16点</span></div>';
  html += '<div class="placeholder-note" id="rdos-interp" style="margin-top:10px;">各項目を選択するとスコアが表示されます。</div>';
  html += '</div>';
  return html;
}

function cycleBaseline(cycle){
  const first = cycle.trim().split(' ')[0];
  return parseFloat(first.split(',')[1]);
}

function waveformSvg(id, cycle, width, height, baseline){
  const L=8, R=8, T=8, B=6;
  const vbX = -L, vbY = -T, vbW = width*2 + L + R, vbH = height + T + B;
  const axis = '<line x1="0" y1="'+(-T+3)+'" x2="0" y2="'+(baseline+5)+'" stroke="var(--ink-3)" stroke-width="0.7" vector-effect="non-scaling-stroke"/>'
    + '<line id="wf-xaxis-'+id+'" x1="0" y1="'+baseline+'" x2="'+(width*2+4)+'" y2="'+baseline+'" stroke="var(--ink-3)" stroke-width="0.7" vector-effect="non-scaling-stroke"/>';
  const tileCount = 6;
  let tiles = '<polyline id="wf-cycle-'+id+'" points="'+cycle+'" fill="none" style="stroke:var(--teal); stroke-width:1.6;" vector-effect="non-scaling-stroke"/>';
  for(let i=1;i<tileCount;i++){
    tiles += '<use href="#wf-cycle-'+id+'" xlink:href="#wf-cycle-'+id+'" x="'+(width*i)+'" y="0"/>';
  }
  return '<svg class="wf-svg" viewBox="'+vbX+' '+vbY+' '+vbW+' '+vbH+'" preserveAspectRatio="none" xmlns:xlink="http://www.w3.org/1999/xlink">'
    + axis
    + '<g id="wf-group-'+id+'" data-wf-group data-width="'+width+'">'
    + tiles
    + '</g></svg>';
}

function waveformBlock(id, cycle, width, height, meta){
  meta = meta || {};
  const yLabel = meta.yLabel || '';
  const baseline = (meta.baseline!==undefined) ? meta.baseline : cycleBaseline(cycle);
  const T=8, B=6;
  const vbH = height + T + B;
  const pct = Math.min(92, Math.max(8, ((baseline+T)/vbH)*100));
  return '<div class="wf-wrap">'
    + waveformSvg(id, cycle, width, height, baseline)
    + '<span class="wf-ylabel" id="wf-ylabel-'+id+'">'+yLabel+' \u2191</span>'
    + '<span class="wf-xlabel" id="wf-xlabel-'+id+'" style="top:'+pct.toFixed(1)+'%;">\u6642\u9593 \u2192</span>'
    + '</div>';
}

let wfRafId = null;
function stopWaveformAnimation(){
  if(wfRafId!==null){ cancelAnimationFrame(wfRafId); wfRafId = null; }
}
function startWaveformAnimation(){
  stopWaveformAnimation();
  const groups = Array.from(document.querySelectorAll('[data-wf-group]'));
  if(groups.length===0) return;
  const speed = 16;
  const start = performance.now();
  function frame(now){
    const elapsed = (now-start)/1000;
    groups.forEach(g=>{
      const w = Number(g.getAttribute('data-width'));
      const offset = (elapsed*speed) % w;
      g.setAttribute('transform','translate('+(-offset)+',0)');
    });
    wfRafId = requestAnimationFrame(frame);
  }
  wfRafId = requestAnimationFrame(frame);
}

function satAH(tempC){
  const es = 6.112 * Math.exp(17.67*tempC/(tempC+243.5));
  return 216.7 * es / (273.15+tempC);
}

      return {main:{label:"A-aDO2", value:Math.round(aado2), unit:"mmHg"}, interp,

    }
  },
  raw:{
    inputs:[
      {id:"ppeak", label:"最高気道内圧(Ppeak)", unit:"cmH2O", type:"number", default:25, step:1},
      {id:"pplat", label:"プラトー圧(Pplateau)", unit:"cmH2O", type:"number", default:20, step:1},
      {id:"flow", label:"吸気流量", unit:"L/分", type:"number", default:60, step:1}
    ],
    compute:(v)=>{
      const flowLs = v.flow/60;
      const raw = (v.ppeak - v.pplat)/flowLs;
      let interp = raw<=10 ? "挿管患者としてはおおむね目安の範囲内" : "上昇あり(気管支攣縮・分泌物貯留・チューブ閉塞・回路屈曲などを考慮)";
      return {main:{label:"気道抵抗(Raw)", value:Math.round(raw*10)/10, unit:"cmH2O/L/秒"}, interp};
    }
  },
  compliance:{
    inputs:[
      {id:"vt", label:"1回換気量(Vt)", unit:"mL", type:"number", default:450, step:10},
      {id:"ppeak", label:"最高気道内圧(Ppeak)", unit:"cmH2O", type:"number", default:25, step:1},
      {id:"pplat", label:"プラトー圧(Pplateau)", unit:"cmH2O", type:"number", default:20, step:1},
      {id:"peep", label:"PEEP", unit:"cmH2O", type:"number", default:5, step:1}
    ],
    compute:(v)=>{
      const cstat = v.vt/(v.pplat - v.peep);

      return {main:{label:"静的コンプライアンス(Cstat)", value:Math.round(cstat), unit:"mL/cmH2O"}, interp,
        sub:[{label:"動的コンプライアンス(Cdyn)", value:Math.round(cdyn), unit:"mL/cmH2O"}]};
    }
  },
  drivingpressure:{
    inputs:[
      {id:"pplat", label:"プラトー圧(Pplateau)", unit:"cmH2O", type:"number", default:20, step:1},

      return {main:{label:"ドライビングプレッシャー", value:Math.round(dp), unit:"cmH2O"}, interp};

  },
  humidity:{
    inputs:[
      {id:"temp", label:"温度", unit:"℃", type:"number", default:37, step:1},

      return {main:{label:"絶対湿度", value:Math.round(ah*10)/10, unit:"mg/L"}, interp};

  },
  ri:{
    inputs:[
      {id:"pao2", label:"PaO2", unit:"mmHg", type:"number", default:80, step:1},
      {id:"paco2", label:"PaCO2", unit:"mmHg", type:"number", default:40, step:1},

    compute:(v)=>{
      const pao2Alv = (v.fio2/100)*(760-47) - v.paco2/0.8;

const STATUS_ORDER = ["未着手","下書き","完成"];

let moduleData = {};
let currentId = null;
let expandedCats = new Set();

function selectModule(id){
  currentId = id;
  const m = MODULES.find(x=>x.id===id);
  if(m) expandedCats.add(m.cat);
  render();
}
function selectOverview(){
  currentId = null;
  render();
}
function toggleCat(cat){
  if(expandedCats.has(cat)) expandedCats.delete(cat);
  else expandedCats.add(cat);
  renderNav();
}

async function loadData(){
  try{
    const res = await window.storage.get('resp-app-module-data');
    moduleData = res ? JSON.parse(res.value) : {};
  }catch(e){
    moduleData = {};
  }
  MODULES.forEach(m=>{ if(!moduleData[m.id]) moduleData[m.id] = {status:"未着手", memo:""}; });
}

async function saveData(){
  try{
    await window.storage.set('resp-app-module-data', JSON.stringify(moduleData));
  }catch(e){
    console.error('保存に失敗しました', e);
  }
}

function statusClass(s){
  if(s==="下書き") return "status-draft";
  if(s==="完成") return "status-done";
  return "";
}

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  const overviewBtn = document.createElement('button');
  overviewBtn.className = 'mod-item' + (currentId===null ? ' active':'');
  overviewBtn.innerHTML = '<span class="dot" style="background:var(--blue)"></span><span class="label">全体の進捗</span>';
  overviewBtn.onclick = selectOverview;
  nav.appendChild(overviewBtn);

  Object.keys(CAT_LABELS).forEach(cat=>{
    const catMods = MODULES.filter(m=>m.cat===cat);
    const isOpen = expandedCats.has(cat);
    const lab = document.createElement('div');
    lab.className = 'cat-label' + (isOpen ? ' expanded' : '');
    lab.innerHTML = catIcon(cat) + '<span>'+CAT_LABELS[cat]+'</span>'
      + '<span class="cat-count mono">'+catMods.length+'</span>'
      + '<span class="chevron"><svg viewBox="0 0 10 10" width="10" height="10"><path d="M3 2l4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
    lab.onclick = ()=> toggleCat(cat);
    nav.appendChild(lab);
    if(isOpen){
      catMods.forEach(m=>{
        const btn = document.createElement('button');
        const st = moduleData[m.id].status;
        btn.className = 'mod-item mod-item-child' + (currentId===m.id ? ' active':'');
        btn.innerHTML = '<span class="dot '+statusClass(st)+'"></span><span class="label">'+m.title+'</span>';
        btn.onclick = ()=> selectModule(m.id);
        nav.appendChild(btn);
      });
    }
  });
}

function lungIllustration(){
  return '<svg viewBox="0 0 100 100" width="100%" height="100%">'
    + '<line x1="50" y1="6" x2="50" y2="26" stroke="var(--ink-3)" stroke-width="2.5" stroke-linecap="round"/>'
    + '<line x1="50" y1="26" x2="36" y2="37" stroke="var(--ink-3)" stroke-width="2.2" stroke-linecap="round"/>'
    + '<line x1="50" y1="26" x2="64" y2="37" stroke="var(--ink-3)" stroke-width="2.2" stroke-linecap="round"/>'
    + '<g class="lung-anim">'
    + '<path d="M36,37 C16,42 9,66 19,83 C27,94 41,90 43,73 C45,56 41,42 36,37 Z" fill="var(--teal)" fill-opacity="0.22" stroke="var(--teal)" stroke-width="1.6"/>'
    + '<path d="M64,37 C84,42 91,66 81,83 C73,94 59,90 57,73 C55,56 59,42 64,37 Z" fill="var(--teal)" fill-opacity="0.22" stroke="var(--teal)" stroke-width="1.6"/>'
    + '</g></svg>';
}

function renderOverview(){
  const main = document.getElementById('main');
  const total = MODULES.length;
  const done = MODULES.filter(m=>moduleData[m.id].status==="完成").length;
  const draft = MODULES.filter(m=>moduleData[m.id].status==="下書き").length;
  const todo = total - done - draft;
  const pct = Math.round((done/total)*100);

  let html = '';
  html += '<div class="disclaimer">';
  html += '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.5L1.5 15h15L9 2.5z"/><path d="M9 7v4"/><circle cx="9" cy="13.2" r="0.4" fill="var(--amber)" stroke="none"/></svg>';
  html += '<div class="disclaimer-text"><strong>ご利用にあたっての注意</strong><br>本アプリの内容は、学習・参考のための一般的な情報として作成したものであり、特定の患者への臨床判断や治療方針を保証するものではありません。数値・基準値は教科書的な目安を含みます。実際のケア・治療にあたっては、必ず<strong>所属施設のプロトコル・マニュアル、および担当医の指示を優先</strong>してください。内容は今後も更新・見直しを行っていきます。</div>';
  html += '</div>';

  html += '<div class="overview-head">';
  html += '<h2>呼吸ケアマップ</h2>';
  html += '<p>酸素療法・人工呼吸器・気道管理に関する内容をモジュール単位で整理しています。左のメニューから各モジュールを選ぶと、扱う予定の内容とステータスを確認・編集できます。</p>';
  html += '</div>';

  html += '<div class="lung-hero">';
  html += '<div class="lung-svg-wrap">'+lungIllustration()+'</div>';
  html += '<div class="lung-hero-info">';
  html += '<div class="lung-hero-title">安静時の呼吸(吸気1秒:呼気2秒)</div>';
  html += '<div class="lung-hero-sub">成人の主な正常値の目安</div>';
  html += '<div class="lung-values">';
  html += '<div class="lung-value-item"><div class="lv-label">呼吸数</div><div class="lv-num mono">12〜20 回/分</div></div>';
  html += '<div class="lung-value-item"><div class="lv-label">1回換気量(TV)・男性目安</div><div class="lv-num mono">約400〜500 mL</div></div>';
  html += '<div class="lung-value-item"><div class="lv-label">1回換気量(TV)・女性目安</div><div class="lv-num mono">約300〜400 mL</div></div>';
  html += '<div class="lung-value-item"><div class="lv-label">生理的PEEP</div><div class="lv-num mono">約3〜5 cmH2O</div></div>';
  html += '</div></div></div>';

  html += '<div class="progress-row">';
  html += '<div class="stat-card"><div class="num mono">'+total+'</div><div class="lab">モジュール数</div></div>';
  html += '<div class="stat-card"><div class="num mono" style="color:var(--teal)">'+done+'</div><div class="lab">完成</div></div>';
  html += '<div class="stat-card"><div class="num mono" style="color:var(--amber)">'+draft+'</div><div class="lab">下書き</div></div>';
  html += '<div class="stat-card"><div class="num mono" style="color:var(--ink-3)">'+todo+'</div><div class="lab">未着手</div></div>';
  html += '</div>';
  html += '<div class="bar-outer"><div class="bar-inner" style="width:'+pct+'%"></div></div>';

  Object.keys(CAT_LABELS).forEach(cat=>{
    const catMods = MODULES.filter(m=>m.cat===cat);
    html += '<div class="cat-block"><h3>'+catIcon(cat)+'<span>'+CAT_LABELS[cat]+'</span><span class="mono" style="color:var(--ink-3); font-size:11px; font-weight:400; text-transform:none;">&nbsp;'+catMods.length+'項目</span></h3><div class="cat-grid">';
    catMods.forEach(m=>{
      const st = moduleData[m.id].status;
      html += '<div class="mini-card" data-id="'+m.id+'" style="--cat-color:'+CAT_COLORS[cat]+'">';
      html += '<div class="mtitle">'+m.title+'</div>';
      html += '<div class="mstatus"><span class="dot '+statusClass(st)+'"></span>'+st+'</div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  main.innerHTML = html;
  main.querySelectorAll('.mini-card').forEach(el=>{
    el.onclick = ()=> selectModule(el.getAttribute('data-id'));
  });
}

function renderModule(){
  const main = document.getElementById('main');
  const m = MODULES.find(x=>x.id===currentId);
  const data = moduleData[m.id];

  let html = '';
  html += '<div class="breadcrumb">'+catIcon(m.cat)+'<span>'+CAT_LABELS[m.cat]+'</span></div>';
  html += '<h2 class="mod-title">'+m.title+'</h2>';
  html += '<p class="mod-goal">'+m.goal+'</p>';

  html += '<div class="status-row"><span class="lab">ステータス:</span>';
  STATUS_ORDER.forEach(s=>{
    const active = s===data.status ? ' st-'+s : '';
    html += '<button class="status-btn'+active+'" data-status="'+s+'">'+s+'</button>';
  });
  html += '</div>';

  if(m.simulator){ html += '<div class="section-block sim-block" id="sim-root"></div>'; }
  html += '<div class="section-block"><h4>'+(m.simulator?'使い方':'この項目で扱う予定の内容')+'</h4><ul>';
  m.points.forEach(p=>{ html += '<li>'+p+'</li>'; });
  html += '</ul></div>';

  if(m.subsections){
    m.subsections.forEach(sub=>{
      html += '<div class="section-block"><h4 class="sub-heading">'+sub.title+'</h4>';
      if(sub.points){
        html += '<ul>';
        sub.points.forEach(p=>{ html += '<li>'+p+'</li>'; });
        html += '</ul>';
      }
      if(sub.table){
        html += '<div class="table-wrap"><table class="ref-table"><thead><tr>';
        sub.table.head.forEach(h=>{ html += '<th>'+h+'</th>'; });
        html += '</tr></thead><tbody>';
        sub.table.rows.forEach(r=>{
          html += '<tr>'; r.forEach(c=>{ html += '<td>'+c+'</td>'; }); html += '</tr>';
        });
        html += '</tbody></table></div>';
      }
      if(sub.careNotes){
        html += '<div style="margin-top:14px; padding-top:12px; border-top:1px solid var(--line);"><div style="color:var(--ink-3); font-weight:500; font-size:11px; letter-spacing:.04em; text-transform:uppercase;">ケアのポイント</div><ul style="margin-top:8px;">';
        sub.careNotes.forEach(p=>{ html += '<li>'+p+'</li>'; });
        html += '</ul></div>';
      }
      html += '</div>';
    });
  }

  if(m.table){
    html += '<div class="section-block"><h4>参考: '+m.table.head[0]+'別の目安</h4>';
    html += '<div class="table-wrap"><table class="ref-table"><thead><tr>';
    m.table.head.forEach(h=>{ html += '<th>'+h+'</th>'; });
    html += '</tr></thead><tbody>';
    m.table.rows.forEach(r=>{
      html += '<tr>'; r.forEach(c=>{ html += '<td>'+c+'</td>'; }); html += '</tr>';
    });
    html += '</tbody></table></div></div>';
  }

  if(m.formula){
    html += '<div class="section-block"><h4>計算方法</h4>';
    html += '<ul>';
    m.formula.steps.forEach(s=>{ html += '<li class="mono" style="font-size:13px;">'+s+'</li>'; });
    html += '</ul>';
    html += '<div class="placeholder-note" style="white-space:pre-line; margin-top:10px;">'+m.formula.example+'</div>';
    html += '</div>';
  }

  if(m.careNotes){
    html += '<div class="section-block"><h4>ケアのポイント・注意点</h4><ul>';
    m.careNotes.forEach(p=>{ html += '<li>'+p+'</li>'; });
    html += '</ul></div>';
  }

  if(m.diagrams){
    html += '<div class="section-block"><h4>波形イメージ(自動でスクロールします)</h4>';
    html += '<div style="display:flex; flex-direction:column; gap:18px;">';
    m.diagrams.forEach((d,i)=>{
      const gid = 'wf-'+m.id+'-'+i;
      html += '<div>';
      html += waveformBlock(gid, d.cycle, 50, 70, {yLabel: d.yLabel});
      html += '<div style="font-size:12px; color:var(--ink-3); margin-top:6px;">'+d.label+'</div>';
      html += '</div>';
    });
    html += '</div></div>';
  }

  if(m.diagramGroups){
    html += '<div class="section-block"><h4>波形イメージ(モードを選択)</h4>';
    html += '<div class="wf-chip-row">';
    m.diagramGroups.forEach((g,i)=>{
      html += '<button class="wf-chip'+(i===0?' active':'')+'" data-gkey="'+g.key+'">'+g.label+'</button>';
    });
    html += '</div>';
    html += '<div id="diagram-group-container" style="display:flex; flex-direction:column; gap:18px;"></div>';
    html += '</div>';
  }

  if(m.waveformPlayer){
    const items = m.waveformPlayer.items;
    const gid = 'wf-'+m.id+'-player';
    html += '<div class="section-block"><h4>波形イメージ(選択して確認)</h4>';
    html += '<div class="wf-chip-row">';
    items.forEach((it,i)=>{
      html += '<button class="wf-chip'+(i===0?' active':'')+'" data-idx="'+i+'">'+it.label+'</button>';
    });
    html += '</div>';
    html += waveformBlock(gid, items[0].cycle, 50, 70, {yLabel: m.waveformPlayer.yLabel});
    html += '<div class="placeholder-note" id="'+gid+'-desc" style="margin-top:12px;">'+items[0].desc+'</div>';
    html += '</div>';
  }

  if(m.rdos){
    html += '<div class="section-block"><h4>日本語版RDOS 判定ツール</h4>' + rdosBlock() + '</div>';
  }

  if(m.reference){
    html += '<div class="section-block"><h4>参考文献</h4><div class="ref-cite">'+m.reference+'</div></div>';
  }

  if(m.ref){
    html += '<div class="section-block"><h4>基準値・目安</h4><div style="font-size:13.5px; color:var(--ink-2);">'+m.ref+'</div></div>';
  }

  if(m.calc && CALC_DEFS[m.calc]){
    const def = CALC_DEFS[m.calc];
    html += '<div class="section-block" id="generic-calc"><h4>計算機</h4>';
    html += '<div class="calc-row">';
    def.inputs.forEach(inp=>{
      html += '<div><label class="field-label">'+inp.label+(inp.unit?' ('+inp.unit+')':'')+'</label>';
      if(inp.type==="select"){
        html += '<select class="calc-select" id="gc-'+inp.id+'" data-id="'+inp.id+'">';
        inp.options.forEach(o=>{ html += '<option value="'+o.value+'"'+(o.value===inp.default?' selected':'')+'>'+o.label+'</option>'; });
        html += '</select></div>';
      } else {
        html += '<input class="calc-input" id="gc-'+inp.id+'" data-id="'+inp.id+'" type="number" step="'+(inp.step||1)+'" value="'+inp.default+'"></div>';
      }
    });
    html += '</div>';
    html += '<div class="calc-result-row"><span id="gc-main-label" class="calc-result-label"></span><span id="gc-main-value" class="mono calc-result-value">--</span></div>';
    html += '<div id="gc-sub" style="font-size:13px; color:var(--ink-2); margin-bottom:8px;"></div>';
    html += '<div id="gc-interp" class="placeholder-note"></div>';
    html += '</div>';
  }

  if(m.calc==="lowflow"){
    html += '<div class="section-block"><h4>FiO2換算計算機</h4>';
    html += '<div class="calc-row">';
    html += '<div><label class="field-label">デバイス</label>';
    html += '<select id="calc-device" class="calc-select">';
    html += '<option value="cannula">鼻カニュラ</option>';
    html += '<option value="simple">簡易酸素マスク</option>';
    html += '<option value="reservoir">リザーバー付きマスク</option>';
    html += '</select></div>';
    html += '<div><label class="field-label">流量(L/分)</label>';
    html += '<input id="calc-flow" class="calc-input" type="number" min="1" max="15" step="1" value="3"></div>';
    html += '</div>';
    html += '<div class="calc-result-row"><span class="calc-result-label">FiO2の目安:</span><span id="calc-result" class="mono calc-result-value" style="font-size:20px;">--</span></div>';
    html += '<div class="placeholder-note" style="margin-top:12px;">この数値は一般的な目安であり、患者の呼吸様式によって実際の値は変動します。SpO2の推移とあわせて評価してください。</div>';
    html += '</div>';
  }

  if(m.calc==="cylinder"){
    html += '<div class="section-block"><h4>使用可能時間 計算機</h4>';
    html += '<div class="calc-row">';
    html += '<div><label class="field-label">内容積(L)</label>';
    html += '<input id="cyl-capacity" class="calc-input" type="number" min="0.1" step="0.1" value="3.4"></div>';
    html += '<div><label class="field-label">現在の圧力(MPa)</label>';
    html += '<input id="cyl-pressure" class="calc-input" type="number" min="0" step="0.1" value="10"></div>';
    html += '<div><label class="field-label">酸素流量(L/分)</label>';
    html += '<input id="cyl-flow" class="calc-input" type="number" min="0.5" step="0.5" value="3"></div>';
    html += '</div>';
    html += '<div class="calc-result-row"><span class="calc-result-label">酸素残量:</span><span id="cyl-remain" class="mono" style="font-size:16px; font-weight:500;">--</span><span class="calc-result-label">L</span></div>';
    html += '<div class="calc-result-row"><span class="calc-result-label">使用可能時間:</span><span id="cyl-time" class="mono calc-result-value">--</span></div>';
    html += '<div style="font-size:13px; color:var(--amber); margin-top:8px;">安全域の目安(計算値の80%): <span id="cyl-safe" class="mono">--</span></div>';
    html += '</div>';
  }

  if(!m.sample){
    html += '<div class="placeholder-note">この項目はまだ骨組みの段階です。具体的な文章・図表・計算ツールは今後追加していきます。</div>';
  }

  html += '<div class="section-block"><h4>メモ</h4><textarea class="memo" id="memo-input" placeholder="この項目についてのメモや参考文献リンクなどを記録できます">'+ (data.memo||'') +'</textarea></div>';

  main.innerHTML = html;

  main.querySelectorAll('.status-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      moduleData[m.id].status = btn.getAttribute('data-status');
      await saveData();
      render();
    };
  });

  const memoEl = document.getElementById('memo-input');
  memoEl.addEventListener('blur', async ()=>{
    moduleData[m.id].memo = memoEl.value;
    await saveData();
    renderNav();
  });

  const calcDevice = document.getElementById('calc-device');
  if(calcDevice){
    const calcFlow = document.getElementById('calc-flow');
    const calcResult = document.getElementById('calc-result');
    const update = ()=>{
      calcResult.textContent = estimateFiO2(calcDevice.value, Number(calcFlow.value));
    };
    calcDevice.addEventListener('change', update);
    calcFlow.addEventListener('input', update);
    update();
  }

  const cylCapacity = document.getElementById('cyl-capacity');
  if(cylCapacity){
    const cylPressure = document.getElementById('cyl-pressure');
    const cylFlow = document.getElementById('cyl-flow');
    const cylRemain = document.getElementById('cyl-remain');
    const cylTime = document.getElementById('cyl-time');
    const cylSafe = document.getElementById('cyl-safe');
    const update = ()=>{
      const cap = Number(cylCapacity.value);
      const pres = Number(cylPressure.value);
      const flow = Number(cylFlow.value);
      if(!cap || !pres || !flow){
        cylRemain.textContent='--'; cylTime.textContent='--'; cylSafe.textContent='--';
        return;
      }
      const remain = cap * pres * 10;
      const minutes = remain / flow;
      const safeMinutes = minutes * 0.8;
      cylRemain.textContent = Math.round(remain);
      cylTime.textContent = formatMinutes(minutes);
      cylSafe.textContent = formatMinutes(safeMinutes);
    };
    [cylCapacity, cylPressure, cylFlow].forEach(el=> el.addEventListener('input', update));
    update();
  }

  if(m.calc && CALC_DEFS[m.calc]){
    const def = CALC_DEFS[m.calc];
    const els = def.inputs.map(inp=> document.getElementById('gc-'+inp.id));
    const update = ()=>{
      const values = {};
      let valid = true;
      def.inputs.forEach((inp, i)=>{
        const raw = els[i].value;
        if(inp.type==="select"){ values[inp.id] = raw; }
        else{
          const num = Number(raw);
          values[inp.id] = num;
          if(raw==='' || isNaN(num)) valid = false;
        }
      });
      const mainLabel = document.getElementById('gc-main-label');
      const mainValue = document.getElementById('gc-main-value');
      const subEl = document.getElementById('gc-sub');
      const interpEl = document.getElementById('gc-interp');
      if(!valid){
        mainLabel.textContent=''; mainValue.textContent='--'; subEl.textContent=''; interpEl.textContent='';
        return;
      }
      const result = def.compute(values);
      mainLabel.textContent = result.main.label + ':';
      mainValue.textContent = result.main.value + (result.main.unit? ' '+result.main.unit : '');
      subEl.textContent = (result.sub||[]).map(s=> s.label+': '+s.value+(s.unit?' '+s.unit:'')).join(' / ');
      interpEl.textContent = result.interp || '';
    };
    els.forEach(el=> el.addEventListener('input', update));
    els.forEach(el=> el.addEventListener('change', update));
    update();
  }

  if(m.waveformPlayer){
    const items = m.waveformPlayer.items;
    const gid = 'wf-'+m.id+'-player';
    const cyclePoly = document.getElementById('wf-cycle-'+gid);
    const descEl = document.getElementById(gid+'-desc');
    const xaxisLine = document.getElementById('wf-xaxis-'+gid);
    const ylabelEl = document.getElementById('wf-ylabel-'+gid);
    const xlabelEl = document.getElementById('wf-xlabel-'+gid);
    main.querySelectorAll('.wf-chip').forEach(chip=>{
      chip.onclick = ()=>{
        const idx = Number(chip.getAttribute('data-idx'));
        const item = items[idx];
        cyclePoly.setAttribute('points', item.cycle);
        descEl.textContent = item.desc;
        const baseline = (item.baseline!==undefined) ? item.baseline : cycleBaseline(item.cycle);
        if(xaxisLine) xaxisLine.setAttribute('y1', baseline), xaxisLine.setAttribute('y2', baseline);
        if(ylabelEl) ylabelEl.textContent = (item.yLabel || m.waveformPlayer.yLabel || '') + ' \u2191';
        if(xlabelEl){
          const T=8, B=6, vbH=70+T+B;
          const pct = Math.min(92, Math.max(8, ((baseline+T)/vbH)*100));
          xlabelEl.style.top = pct.toFixed(1)+'%';
        }
        main.querySelectorAll('.wf-chip').forEach(c=> c.classList.remove('active'));
        chip.classList.add('active');
      };
    });
  }

  if(m.diagramGroups){
    const container = document.getElementById('diagram-group-container');
    const renderGroup = (key)=>{
      const g = m.diagramGroups.find(x=>x.key===key);
      let inner = '';
      g.diagrams.forEach((d,i)=>{
        const gid = 'wf-'+m.id+'-'+key+'-'+i;
        inner += '<div>'+waveformBlock(gid, d.cycle, 50, 70, {yLabel:d.yLabel})
          + '<div style="font-size:12px; color:var(--ink-3); margin-top:6px;">'+d.label+'</div></div>';
      });
      container.innerHTML = inner;
      main.querySelectorAll('[data-gkey]').forEach(c=> c.classList.toggle('active', c.getAttribute('data-gkey')===key));
      startWaveformAnimation();
    };
    main.querySelectorAll('[data-gkey]').forEach(chip=>{
      chip.onclick = ()=> renderGroup(chip.getAttribute('data-gkey'));
    });
    renderGroup(m.diagramGroups[0].key);
  }

  if(m.rdos){
    const selections = {};
    const totalEl = document.getElementById('rdos-total');
    const interpEl = document.getElementById('rdos-interp');
    const update = ()=>{
      const total = Object.values(selections).reduce((a,b)=>a+b,0);
      totalEl.textContent = total;
      if(Object.keys(selections).length < RDOS_ITEMS.length){
        interpEl.textContent = 'すべての項目を選択すると判定が表示されます(現在 '+Object.keys(selections).length+' / '+RDOS_ITEMS.length+' 項目選択済み)';
      } else if(total >= 3){
        interpEl.textContent = 'スコア '+total+' 点: 3点以上のため、呼吸困難ありと判断される目安です。スコアが高いほど症状が強いことが示唆されます。';
      } else {
        interpEl.textContent = 'スコア '+total+' 点: 3点未満のため、呼吸困難なしと判断される目安です。';
      }
    };
    main.querySelectorAll('.rdos-opt').forEach(btn=>{
      btn.onclick = ()=>{
        const itemId = btn.getAttribute('data-item');
        const score = Number(btn.getAttribute('data-score'));
        selections[itemId] = score;
        main.querySelectorAll('.rdos-opt[data-item="'+itemId+'"]').forEach(b=> b.classList.remove('active'));
        btn.classList.add('active');
        update();
      };
    });
  }

  startWaveformAnimation();
  if(m.simulator && typeof simBuildUI==='function'){ simBuildUI(); }
}

function formatMinutes(min){
  if(min<60) return Math.round(min)+'分';
  const h = Math.floor(min/60);
  const m = Math.round(min%60);
  return h+'時間'+m+'分';
}

function estimateFiO2(device, flow){
  if(!flow || flow<=0) return '--';
  if(device==="cannula"){
    if(flow>6) return '鼻カニュラは通常6L/分までが目安です';
    return Math.round(21 + 4*flow) + '%前後';
  }
  if(device==="simple"){
    if(flow<5) return '5L/分未満は非推奨(CO2再呼吸のおそれ)';
    if(flow<6) return '40%前後';
    if(flow<7) return '50%前後';
    if(flow<=8) return '60%前後';
    return '60%以上(上限の目安)';
  }
  if(device==="reservoir"){
    if(flow<6) return '6L/分以上での使用が基本です';
    const table = {6:60,7:70,8:80,9:90,10:95};
    const f = Math.min(Math.round(flow),10);
    return (table[f] || 95) + '%前後';
  }
  return '--';
}

function animateWave(){
  const line = document.getElementById('wave-line');
  let t = 0;
  setInterval(()=>{
    t += 0.12;
    const pts = [];
    for(let x=0; x<=140; x+=4){
      let y = 17;
      const px = x - (t*20 % 140);
      const rel = ((px % 140)+140)%140;
      if(rel>28 && rel<40){
        const local = rel-28;
        y = 17 - Math.sin(local/12*Math.PI)*13;
      }
      pts.push(x+','+y);
    }
    line.setAttribute('points', pts.join(' '));
  }, 60);
}

// ===== 人工呼吸管理シミュレーター: 計算モデル(1コンパートメント) =====
// V: 緩和容量(大気圧で肺が落ち着く容量)からの上乗せ容量(mL)
// Paw = V/C + R*Flow   (吸気側の気道内圧)
// 呼気は受動的: 流量 = -(V/C - PEEP)/R
const SIM_DEFAULT = {mode:'VC', vt:450, pins:8, pattern:'square', rr:14, ti:1.0, peep:5, R:8, C:60, sex:'male', height:170};

function simPBW(sex, height){
  return (sex==='male' ? 50 : 45.5) + 0.91*(height-152.4);
}

function simulateVent(p){
  const T = 60/p.rr;
  const tiClamped = p.ti > T - 0.2;
  const Ti = Math.max(0.2, Math.min(p.ti, T - 0.2));
  const Te = T - Ti;
  const C = p.C, R = p.R, PEEP = p.peep;
  const tau = R*C/1000;
  const QMAX = 3.5;            // 最大流量の上限(L/秒) = 210 L/分
  const FEND = 0.25;           // 漸減波: 吸気終末の流量がピークの何割か
  const nI = Math.max(10, Math.round(Ti/0.01));
  const nE = Math.max(10, Math.round(Te/0.01));
  const dtI = Ti/nI, dtE = Te/nE;
  const isVC = p.mode === 'VC';
  const qpk = isVC ? (p.pattern === 'decel' ? 2*p.vt/(1000*Ti*(1+FEND)) : p.vt/(1000*Ti)) : 0;
  const rise = Math.min(0.1, Ti/3);   // PCの圧立ち上がり時間(秒)
  let V = PEEP*C;

  function runCycle(){
    const t = [], paw = [], flow = [], vol = [];
    const V0 = V;
    let ppeak = -Infinity, qPeakI = 0, qEndI = 0;
    for(let i=0; i<nI; i++){
      const tm = (i + 0.5)*dtI;
      let q, pw, Vn;
      if(isVC){
        q = p.pattern === 'decel' ? qpk*(1 - (1 - FEND)*tm/Ti) : qpk;
        Vn = V + q*1000*dtI;
        pw = ((V + Vn)/2)/C + R*q;
      } else {
        const tgt = PEEP + p.pins*Math.min(1, tm/rise);
        const k = Math.exp(-dtI*1000/(R*C));
        Vn = C*tgt + (V - C*tgt)*k;
        q = (Vn - V)/dtI/1000;
        if(q < 0){ Vn = V; q = 0; }
        if(q > QMAX){ q = QMAX; Vn = V + q*1000*dtI; pw = ((V + Vn)/2)/C + R*q; }
        else { pw = tgt; }
      }
      V = Vn;
      t.push((i + 1)*dtI); paw.push(pw); flow.push(q*60); vol.push(V - V0);
      if(pw > ppeak) ppeak = pw;
      if(q*60 > qPeakI) qPeakI = q*60;
      qEndI = q*60;
    }
    const Vei = V;
    let qPeakE = 0, qEndE = 0;
    const kE = Math.exp(-dtE*1000/(R*C));
    for(let i=0; i<nE; i++){
      const Vn = C*PEEP + (V - C*PEEP)*kE;
      const q = (Vn - V)/dtE/1000;
      V = Vn;
      t.push(Ti + (i + 1)*dtE); paw.push(PEEP); flow.push(q*60); vol.push(V - V0);
      if(q*60 < qPeakE) qPeakE = q*60;
      qEndE = q*60;
    }
    return {t, paw, flow, vol, V0, Vei, ppeak, qPeakI, qEndI, qPeakE, qEndE};
  }

  let prevV0 = null, cyc = null;
  for(let n=0; n<150; n++){
    const V0 = V;
    cyc = runCycle();
    if(prevV0 !== null && Math.abs(V0 - prevV0) < 0.02 && n >= 3) break;
    prevV0 = V0;
  }
  const Vt = cyc.Vei - cyc.V0;
  const Pplat = cyc.Vei/C;
  const PEEPtot = cyc.V0/C;
  return {
    T, Ti, Te, tau, tiClamped,
    t:cyc.t, paw:cyc.paw, flow:cyc.flow, vol:cyc.vol,
    Vt, Pplat, PEEPtot, autoPEEP: Math.max(0, PEEPtot - PEEP),
    Ppeak: cyc.ppeak, qPeakI: cyc.qPeakI, qEndI: cyc.qEndI, qPeakE: cyc.qPeakE, qEndE: cyc.qEndE,
    MV: Vt*p.rr/1000, teTau: Te/tau
  };
}

function simBuildSeries(sim, W){
  const pts = {paw:[], flow:[], vol:[], bands:[]};
  const T = sim.T;
  const last = sim.t.length - 1;
  pts.paw.push([0, sim.paw[last]]); pts.flow.push([0, sim.flow[last]]); pts.vol.push([0, sim.vol[last]]);
  const n = Math.ceil(W/T) + 1;
  for(let k=0; k<n; k++){
    const s = k*T;
    if(s < W) pts.bands.push([s, Math.min(W, s + sim.Ti)]);
  }
  outer: for(let k=0; k<n; k++){
    for(let i=0; i<sim.t.length; i++){
      const tt = k*T + sim.t[i];
      if(tt > W) break outer;
      pts.paw.push([tt, sim.paw[i]]); pts.flow.push([tt, sim.flow[i]]); pts.vol.push([tt, sim.vol[i]]);
    }
  }
  return pts;
}

function simBind(root){
  const st = simGet();

  root.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const key = inp.getAttribute('data-key');
      const step = Number(inp.getAttribute('data-step'));
      const v = Number(inp.value);
      st.p[key] = v;
      const lab = document.getElementById('sv-'+key);
      if(lab) lab.textContent = simFmtVal(v, step) + ' ' + SIM_UNITS[key];
      if(key === 'R' || key === 'C'){
        root.querySelectorAll('[data-preset]').forEach(b=>{
          const pr = SIM_PRESETS.find(x=> x.key === b.getAttribute('data-preset'));
          b.classList.toggle('active', pr.R === st.p.R && pr.C === st.p.C);
        });
      }
      simUpdate();
    });
  });

  const sexEl = document.getElementById('sim-sex');
  const hEl = document.getElementById('sim-height');
  const onBody = ()=>{
    st.p.sex = sexEl.value;
    const hv = Number(hEl.value);
    if(hv >= 100 && hv <= 220) st.p.height = hv;
    simUpdate();
  };
  sexEl.addEventListener('change', onBody);
  hEl.addEventListener('input', onBody);

  root.querySelectorAll('[data-preset]').forEach(b=>{
    b.onclick = ()=>{
      const pr = SIM_PRESETS.find(x=> x.key === b.getAttribute('data-preset'));
      st.p.R = pr.R; st.p.C = pr.C;
      simBuildUI();
    };
  });
  root.querySelectorAll('[data-mode]').forEach(b=>{
    b.onclick = ()=>{ st.p.mode = b.getAttribute('data-mode'); simBuildUI(); };
  });
  root.querySelectorAll('[data-pattern]').forEach(b=>{
    b.onclick = ()=>{ st.p.pattern = b.getAttribute('data-pattern'); simBuildUI(); };
  });
  root.querySelectorAll('[data-win]').forEach(b=>{
    b.onclick = ()=>{ st.win = Number(b.getAttribute('data-win')); simBuildUI(); };
  });
  root.querySelectorAll('[data-scn]').forEach(b=>{
    b.onclick = ()=>{
      const s = SIM_SCENARIOS[Number(b.getAttribute('data-scn'))];
      st.p = Object.assign(simClone(SIM_DEFAULT), s.over);
      st.ghost = simClone(st.p);
      st.hint = s.hint; st.hintTitle = 'シナリオ: ' + s.label;
      simBuildUI();
    };
  });
  root.querySelectorAll('[data-act]').forEach(b=>{
    b.onclick = ()=>{
      const act = b.getAttribute('data-act');
      if(act === 'play'){ st.playing = !st.playing; simBuildUI(); return; }
      if(act === 'pin'){ st.ghost = simClone(st.p); }
      else if(act === 'unpin'){ st.ghost = null; }
      else if(act === 'reset'){ st.p = simClone(SIM_DEFAULT); st.ghost = null; st.hint = ''; st.hintTitle = ''; }
      simBuildUI();
    };
  });
}

// ---------- 描画 ----------
function simPick(cands, v){
  for(const c of cands){ if(v <= c) return c; }
  return cands[cands.length - 1];
}
function simTicks(min, max){
  const raw = (max - min)/4;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw/mag;
  const step = (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10)*mag;
  const out = [];
  for(let v = Math.ceil(min/step - 1e-9)*step; v <= max + 1e-9; v += step) out.push(Math.round(v*100)/100);
  return out;
}

function simChartSvg(cfg, cur, gh, bands, W, width, isLast, Tc, Tg){
  const ml = 50, mr = 10, mt = 22, plotH = 98, mb = isLast ? 36 : 6;
  const H = mt + plotH + mb;
  const pw = width - ml - mr;
  const x = t => ml + t/W*pw;
  const pps = pw/W;
  const y = v => mt + (cfg.max - v)/(cfg.max - cfg.min)*plotH;
  const poly = arr => arr.map(pt => x(pt[0]).toFixed(1) + ',' + y(pt[1]).toFixed(1)).join(' ');
  const cid = 'simclip-' + cfg.key;
  let s = '<svg class="sim-svg" width="'+width+'" height="'+H+'" viewBox="0 0 '+width+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
  s += '<defs><clipPath id="'+cid+'"><rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+plotH+'"/></clipPath></defs>';
  s += '<rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+plotH+'" style="fill:var(--panel-alt);"/>';
  // 横グリッド + 縦軸ラベル
  simTicks(cfg.min, cfg.max).forEach(v=>{
    const yy = y(v).toFixed(1);
    const strong = (cfg.zero && v === 0);
    s += '<line x1="'+ml+'" x2="'+(ml+pw)+'" y1="'+yy+'" y2="'+yy+'" style="stroke:'+(strong ? 'var(--ink-3)' : 'var(--line)')+'; stroke-width:1;"/>';
    s += '<text x="'+(ml-6)+'" y="'+(Number(yy)+3.5)+'" text-anchor="end" style="fill:var(--ink-3); font-size:10.5px;">'+v+'</text>';
  });
  // 縦グリッド(時間)
  let tstep = W <= 12 ? 1 : 2;
  while((W/tstep)*30 > pw) tstep *= 2;
  for(let t = 0; t <= W + 1e-9; t += tstep){
    const xx = x(t).toFixed(1);
    s += '<line x1="'+xx+'" x2="'+xx+'" y1="'+mt+'" y2="'+(mt+plotH)+'" style="stroke:var(--line); stroke-width:1; opacity:.6;"/>';
    if(isLast) s += '<text x="'+xx+'" y="'+(mt+plotH+14)+'" text-anchor="middle" style="fill:var(--ink-3); font-size:10.5px;">'+t+'</text>';
  }
  // 波形
  s += '<g clip-path="url(#'+cid+')">';
  s += '<g class="sim-scroll" data-t="'+Tc+'" data-pps="'+pps+'">';
  bands.forEach(b=>{
    s += '<rect x="'+x(b[0]).toFixed(1)+'" y="'+mt+'" width="'+(x(b[1]) - x(b[0])).toFixed(1)+'" height="'+plotH+'" style="fill:var(--teal); opacity:.08;"/>';
  });
  s += '<polyline points="'+poly(cur)+'" fill="none" stroke-linejoin="round" style="stroke:'+cfg.color+'; stroke-width:1.9;"/>';
  s += '</g>';
  if(gh) s += '<g class="sim-scroll" data-t="'+Tg+'" data-pps="'+pps+'"><polyline points="'+poly(gh)+'" fill="none" style="stroke:var(--ink-2); stroke-width:1.4; stroke-dasharray:5 4; opacity:.85;"/></g>';
  s += '</g>';
  // 枠・タイトル
  s += '<rect x="'+ml+'" y="'+mt+'" width="'+pw+'" height="'+plotH+'" fill="none" style="stroke:var(--line-strong); stroke-width:1;"/>';
  s += '<text x="'+ml+'" y="14" style="fill:var(--ink); font-size:12px; font-weight:500;">'+cfg.title+'<tspan style="fill:var(--ink-3); font-size:11px; font-weight:400;">  ('+cfg.unit+')  ↑</tspan></text>';
  if(isLast) s += '<text x="'+(ml+pw)+'" y="'+(H-4)+'" text-anchor="end" style="fill:var(--ink-3); font-size:11px;">時間 (秒) →</text>';
  s += '</svg>';
  return s;
}

function simDrawCharts(cur, gh, W){
  const el = document.getElementById('sim-charts');
  if(!el) return;
  const width = Math.max(280, Math.floor(el.clientWidth || 600));
  const sc = simBuildSeries(cur, W + cur.T);
  const gs = gh ? simBuildSeries(gh, W + gh.T) : null;
  const pawMax = simPick([30,40,60,80,120], Math.max(cur.Ppeak, gh ? gh.Ppeak : 0)*1.05);
  const fMax = simPick([60,100,150,200,300], Math.max(cur.qPeakI, gh ? gh.qPeakI : 0)*1.05);
  const fMin = -simPick([30,60,100,150,200,300], -Math.min(cur.qPeakE, gh ? gh.qPeakE : 0)*1.05);
  const vMax = simPick([600,1000,1500,2000], Math.max(cur.Vt, gh ? gh.Vt : 0)*1.05);
  const cfgs = [
    {key:'paw',  title:'気道内圧', unit:'cmH2O', color:'var(--amber)', min:0,    max:pawMax},
    {key:'flow', title:'流量',     unit:'L/分',  color:'var(--teal)',  min:fMin, max:fMax, zero:true},
    {key:'vol',  title:'換気量',   unit:'mL',    color:'var(--blue)',  min:0,    max:vMax}
  ];
  el.innerHTML = cfgs.map((c,i)=> simChartSvg(c, sc[c.key], gs ? gs[c.key] : null, sc.bands, W, width, i === cfgs.length - 1, cur.T, gh ? gh.T : 0)).join('');
  simScrollTick();
}

function simDrawMetrics(cur, gh, p){
  const el = document.getElementById('sim-metrics');
  if(!el) return;
  const pbw = simPBW(p.sex, p.height);
  const pbwEl = document.getElementById('sim-pbw');
  if(pbwEl) pbwEl.textContent = '予測体重(PBW): ' + pbw.toFixed(1) + ' kg';
  const vtkg = cur.Vt/pbw;
  const dp = cur.Pplat - p.peep;
  const g = gh ? simAnalyzeLite(gh, simGet().ghost) : null;
  const items = [
    {label:'ピーク圧(Ppeak)', v:cur.Ppeak, d:1, unit:'cmH2O', gv:g && g.Ppeak},
    {label:'プラトー圧(Pplat)', v:cur.Pplat, d:1, unit:'cmH2O', gv:g && g.Pplat, lv: cur.Pplat > 30 ? 'danger' : (cur.Pplat > 28 ? 'warn' : '')},
    {label:'ドライビングプレッシャー(Pplat−設定PEEP)', v:dp, d:1, unit:'cmH2O', gv:g && g.dp, lv: dp > 15 ? 'warn' : ''},
    {label:'1回換気量(Vt)', v:cur.Vt, d:0, unit:'mL', gv:g && g.Vt, sub: vtkg.toFixed(1) + ' mL/kg (PBW)', lv: (vtkg > 8 || vtkg < 4) ? 'warn' : ''},
    {label:'分時換気量', v:cur.MV, d:1, unit:'L/分', gv:g && g.MV},
    {label:'I:E比', text:'1 : ' + (cur.Te/cur.Ti).toFixed(1), gtext: g && ('1 : ' + g.ie.toFixed(1)), sub:'Ti ' + cur.Ti.toFixed(1) + '秒 / Te ' + cur.Te.toFixed(1) + '秒', lv: cur.Ti > cur.Te ? 'warn' : ''},
    {label:'Auto-PEEP', v:cur.autoPEEP, d:1, unit:'cmH2O', gv:g && g.autoPEEP, sub:'Te/τ = ' + cur.teTau.toFixed(1), lv: cur.autoPEEP >= 1 ? 'warn' : ''},
    {label:'最大吸気流量', v:cur.qPeakI, d:0, unit:'L/分', gv:g && g.qPeakI}
  ];
  el.innerHTML = items.map(it=>{
    const val = it.text !== undefined ? it.text : (it.v.toFixed(it.d) + '<span class="sm-unit"> ' + it.unit + '</span>');
    let sub = it.sub ? '<div class="sm-sub">'+it.sub+'</div>' : '';
    if(it.gv !== undefined && it.gv !== null && it.gv !== false) sub += '<div class="sm-sub ghost">基準 ' + Number(it.gv).toFixed(it.d) + ' ' + it.unit + '</div>';
    else if(it.gtext) sub += '<div class="sm-sub ghost">基準 ' + it.gtext + '</div>';
    return '<div class="sim-metric '+(it.lv || '')+'"><div class="sm-label">'+it.label+'</div><div class="sm-val mono">'+val+'</div>'+sub+'</div>';
  }).join('');
}

function simAnalyzeLite(sim, p){
  return {Ppeak:sim.Ppeak, Pplat:sim.Pplat, dp:sim.Pplat - p.peep, Vt:sim.Vt, MV:sim.MV, ie:sim.Te/sim.Ti, autoPEEP:sim.autoPEEP, qPeakI:sim.qPeakI};
}

function simDrawComments(cur, p){
  const el = document.getElementById('sim-comments');
  if(!el) return;
  const pbw = simPBW(p.sex, p.height);
  const vtkg = cur.Vt/pbw;
  const dp = cur.Pplat - p.peep;
  const out = [];
  if(cur.tiClamped) out.push({lv:'info', t:'吸気時間が呼吸周期に対して長すぎるため、呼気時間を最低0.2秒確保するよう自動調整して表示しています。'});
  if(cur.autoPEEP >= 1) out.push({lv:'warn', t:'Auto-PEEP(オートピープ)が約' + cur.autoPEEP.toFixed(1) + 'cmH2O生じています。呼気流量がゼロに戻る前に次の吸気が始まっている状態です(呼気時間Teが時定数τの' + cur.teTau.toFixed(1) + '倍。一般にTeがτの3倍以上あると呼気はほぼ完了します)。一般的には、呼吸数を下げる・吸気時間を短くして呼気時間を延ばす、気道抵抗の原因(分泌物・気管支攣縮など)に対応する、といった方向で検討されます。'});
  if(cur.Pplat > 30) out.push({lv:'warn', t:'プラトー圧が30cmH2Oを超えています。VCでは1回換気量、PCでは吸気圧を下げる方向が一般的です。肺が硬い(コンプライアンス低下)原因の評価も重要です。'});
  if(dp > 15) out.push({lv:'warn', t:'ドライビングプレッシャー(Pplat−設定PEEP)が' + dp.toFixed(1) + 'cmH2Oで、15を超えています。換気量を下げると下がるのが一般的ですが、下げても高いままの場合は、肺そのものの状態(ARDSなど)を医師と評価します。'});
  if(vtkg > 8) out.push({lv:'warn', t:'1回換気量が予測体重あたり' + vtkg.toFixed(1) + 'mL/kgで、8mL/kgを超えています。肺保護換気では6〜8mL/kg(ARDSでは6mL/kg前後)が一般的な目安です。'});
  if(vtkg < 4) out.push({lv:'warn', t:'1回換気量が予測体重あたり' + vtkg.toFixed(1) + 'mL/kgと小さめです。分時換気量が不足してCO2が貯留する可能性があります(呼吸数や吸気圧との兼ね合いで評価します)。'});
  if(p.mode === 'VC' && (cur.Ppeak - cur.Pplat) > 10) out.push({lv:'warn', t:'ピーク圧とプラトー圧の差が約' + (cur.Ppeak - cur.Pplat).toFixed(1) + 'cmH2Oと大きく、気道抵抗が高い所見です。分泌物の貯留、気管チューブや回路の屈曲・閉塞、気管支攣縮などを確認します(吸引・体位・回路確認、必要に応じて医師へ報告)。'});
  if(p.mode === 'PC' && cur.qEndI > Math.max(5, 0.2*cur.qPeakI)) out.push({lv:'warn', t:'吸気の終わりでも流量がゼロに戻っていません。設定した吸気時間内に肺が圧に追いつけておらず、1回換気量が十分に入っていない可能性があります。一般的には吸気時間を延ばす、または吸気圧を上げると1回換気量が増えます(Auto-PEEPやピーク圧への影響もあわせて確認します)。'});
  if(cur.Ti > cur.Te) out.push({lv:'warn', t:'吸気時間が呼気時間より長い設定(逆比換気)です。通常の設定ではないため意図した設定かを確認します。呼気時間が短くなるため、Auto-PEEPが生じやすくなります。'});
  if(!out.some(o=> o.lv === 'warn')) out.push({lv:'ok', t:'この設定・肺モデルでは、目安から外れる所見は出ていません(シミュレーター上の簡易的な判断です)。'});
  if(p.mode === 'PC') out.push({lv:'info', t:'従圧式(PC)は気道内圧が一定に保たれるため、換気量は肺の状態(気道抵抗・コンプライアンス)に応じて変動します。VCに切り替えて比べてみましょう。'});
  else out.push({lv:'info', t:'従量式(VC)は換気量が一定に保たれるため、肺の状態が悪化すると気道内圧が上昇します。PCに切り替えて比べてみましょう。'});
  el.innerHTML = out.map(o=> '<div class="sim-comment '+o.lv+'"><span class="sc-dot"></span><div>'+o.t+'</div></div>').join('');
}

function simUpdate(){
  const root = document.getElementById('sim-root');
  if(!root) return;
  const st = simGet();
  const cur = simulateVent(st.p);
  const gh = st.ghost ? simulateVent(st.ghost) : null;
  simDrawCharts(cur, gh, st.win);
  simDrawMetrics(cur, gh, st.p);
  simDrawComments(cur, st.p);
  simAnimStart();
  const lg = document.getElementById('sim-legend');
  if(lg) lg.innerHTML = '<span class="lg-band"></span>薄い帯 = 吸気の時間(波形は右から左へ流れます)' + (gh ? '<span class="lg-dash"></span>破線 = 基準として固定した設定の波形' : '');
}

let simT0 = performance.now(), simPausedAt = null, simPausedTotal = 0, simAnimOn = false;
function simElapsed(){
  const st = simGet();
  const now = performance.now();
  if(!st.playing){ if(simPausedAt === null) simPausedAt = now; return (simPausedAt - simT0 - simPausedTotal)/1000; }
  if(simPausedAt !== null){ simPausedTotal += now - simPausedAt; simPausedAt = null; }
  return (now - simT0 - simPausedTotal)/1000;
}
function simScrollTick(){
  const el = document.getElementById('sim-charts');
  if(!el) return false;
  const e = simElapsed();
  el.querySelectorAll('.sim-scroll').forEach(g=>{
    const T = Number(g.getAttribute('data-t')), pps = Number(g.getAttribute('data-pps'));
    if(T > 0) g.setAttribute('transform', 'translate(' + (-(e % T)*pps).toFixed(2) + ',0)');
  });
  return true;
}
function simAnimLoop(){
  if(!simScrollTick()){ simAnimOn = false; return; }
  requestAnimationFrame(simAnimLoop);
}
function simAnimStart(){ if(!simAnimOn){ simAnimOn = true; requestAnimationFrame(simAnimLoop); } }

(function(){
  let raf = null;
  window.addEventListener('resize', ()=>{
    if(raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(()=>{ if(document.getElementById('sim-charts')) simUpdate(); });
  });
})();

(async function init(){
  await loadData();
  render();
  animateWave();
})();
</script>
